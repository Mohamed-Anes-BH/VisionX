<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titre %}Plateforme d'agents{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Plateforme d'agents</a>
        <div class="d-flex">
            {% if user %}
                {% if user.role.value == "platform_admin" %}
                    <a class="btn btn-outline-light btn-sm me-2" href="/admin">Administration</a>
                {% else %}
                    <a class="btn btn-outline-light btn-sm me-2" href="/catalogue">Catalogue</a>
                    <a class="btn btn-outline-light btn-sm me-2" href="/mon-compte">Mon compte</a>
                {% endif %}
                <a class="btn btn-light btn-sm" href="/deconnexion">Se deconnecter</a>
            {% else %}
                <a class="btn btn-outline-light btn-sm me-2" href="/connexion">Connexion</a>
                <a class="btn btn-light btn-sm" href="/inscription">Inscrire mon entreprise</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block contenu %}{% endblock %}
</div>

</body>
</html>
